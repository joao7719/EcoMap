<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoMap - Pontos de reciclagem</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<header class="topo">
    <div class="container">
        <h1>♻️ EcoMap</h1>
        <p>Encontre pontos de reciclagem por cidade e tipo de material.</p>
    </div>
</header>

<main class="container">
    <form id="form-filtros" class="filtros" aria-label="Buscar e filtrar pontos de reciclagem">
        <div class="campo campo-busca">
            <label for="busca">Buscar por nome ou material</label>
            <input type="search" id="busca" name="busca" maxlength="100" autocomplete="off"
                   placeholder="Ex.: Recicla Mais, vidro, óleo">
        </div>

        <div class="campo">
            <label for="filtro-cidade">Cidade</label>
            <select id="filtro-cidade" name="cidade">
                <option value="">Todas as cidades</option>
            </select>
        </div>

        <div class="campo">
            <label for="filtro-material">Material aceito</label>
            <select id="filtro-material" name="material">
                <option value="">Todos os materiais</option>
            </select>
        </div>

        <div class="acoes">
            <button type="submit" class="botao botao-primario">Filtrar</button>
            <button type="button" id="limpar-filtros" class="botao botao-secundario">Limpar filtros</button>
        </div>

        <div id="bloco-localizacao" class="localizacao">
            <button type="button" id="usar-localizacao" class="botao botao-secundario">Usar minha localização</button>
            <p id="localizacao-status" class="localizacao-status" aria-live="polite"></p>
        </div>
    </form>

    <section id="cadastro" aria-labelledby="titulo-cadastro" class="cadastro">
        <h2 id="titulo-cadastro">Cadastrar ponto de reciclagem</h2>
        <form id="form-cadastro" class="filtros" aria-describedby="cadastro-status">
            <div class="campo"><label for="cadastro-nome">Nome *</label><input id="cadastro-nome" name="nome" required maxlength="120"></div>
            <div class="campo"><label for="cadastro-endereco">Endereço *</label><input id="cadastro-endereco" name="endereco" required maxlength="160"></div>
            <div class="campo"><label for="cadastro-cidade">Cidade *</label><input id="cadastro-cidade" name="cidade" required maxlength="80"></div>
            <div class="campo"><label for="cadastro-estado">UF *</label><input id="cadastro-estado" name="estado" required minlength="2" maxlength="2" pattern="[A-Za-z]{2}" placeholder="SP"></div>
            <div class="campo"><label for="cadastro-materiais">Materiais</label><input id="cadastro-materiais" name="materiais" placeholder="papel, vidro, plastico"></div>
            <div class="acoes"><button type="submit" class="botao botao-primario">Cadastrar ponto</button></div>
            <p id="cadastro-status" class="localizacao-status" aria-live="polite"></p>
        </form>
    </section>
    <section id="resultados" aria-labelledby="titulo-resultados">
        <div class="resultados-topo">
            <h2 id="titulo-resultados">Pontos de reciclagem</h2>
            <p id="resumo" class="resumo" aria-live="polite"></p>
        </div>

        <div id="carregando" class="mensagem" role="status" hidden>
            <span class="spinner" aria-hidden="true"></span>
            Carregando pontos de reciclagem…
        </div>

        <div id="vazio" class="mensagem" role="status" hidden>
            <p id="vazio-texto"></p>
        </div>

        <div id="erro" class="mensagem mensagem-erro" role="alert" hidden>
            <p>Não foi possível carregar os pontos de reciclagem. Verifique sua conexão e tente novamente.</p>
            <button type="button" id="tentar-novamente" class="botao botao-secundario">Tentar novamente</button>
        </div>

        <ul id="lista-pontos" class="lista" hidden></ul>
    </section>
</main>

<script src="/js/geo.js" defer></script>
<script src="/js/app.js" defer></script>

</body>
</html>
